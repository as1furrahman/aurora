# Aurora curated skill catalog (R2). Research and rationale: docs/research/agent-skills-landscape-2026-10.md
#
# Aurora vendors NO third-party skill content. Every entry points at an upstream repository pinned
# to a full commit SHA. Revs, paths, description lengths and flags were measured from the pinned trees on
# `verified_on`. `description_chars` is the parsed SKILL.md description (whitespace collapsed, as
# `aurora skills inspect` reports it): what each CLI injects into its always-loaded skill listing.
#
# kind:  skill     SKILL.md installed into a CLI's skill directory (counts against its listing budget)
#        rules     always-on instructions projected into CLAUDE.md / AGENTS.md (not a triggered skill)
#        framework a whole lifecycle methodology; at most one per project; never installed by Aurora
#        infra     a proxy, hook or MCP server; outside the skill layer; never installed by Aurora
# sha256: content hash of the skill directory at rev (`aurora skills fetch <id>`); installs are refused
#        when the fetched content differs. reviewed: what a human read, valid only for that hash.
# tier:  baseline  every stage of every workflow
#        stage     only the listed roles (and stages, when given)
#        opt-in    only when requested with --with <id>
# trust: official  maintained by an organisation as a product
#        curated   individual maintainer, reviewed for this catalog
#        community provenance or popularity unverified: review SKILL.md and every file before install
# flags: hooks (Claude-only session hooks), scripts (bundled executables), allowed-tools (pre-approves
#        tools in Claude Code), manual-only (upstream disables model invocation), share-alike (CC-BY-SA),
#        popularity-unverified, no-license-file, telemetry, network, non-osi-license

schema_version = 1
verified_on = "2026-10-24"

# ---------------------------------------------------------------- per-CLI targets
# listing_chars: always-loaded skill listing budget; per_skill_chars: per-skill description cap.

[targets.claude]
listing_chars = 8000
per_skill_chars = 1536
rules_file = "CLAUDE.md"
evidence = "https://code.claude.com/docs/en/skills (description + when_to_use capped at 1,536 chars; listing ~1% of context, 8k-char fallback per secondary sources)"

[targets.codex]
listing_chars = 8000
rules_file = "AGENTS.md"
evidence = "https://learn.chatgpt.com/docs/build-skills (at most 2% of context or 8,000 chars when the window is unknown)"

[targets.antigravity]
listing_chars = 8000
rules_file = "AGENTS.md"
evidence = "Undocumented; assumed equal to Codex. The agy 1.4.6 binary references AGENTS.md and GEMINI.md."

[targets.hermes]
listing_chars = 12000
rules_file = "AGENTS.md"
evidence = "Hermes docs: level-0 skills_list() ~3k tokens. Context files from agent/coding_context.py (v0.22.5): AGENTS.md, CLAUDE.md, .cursorrules"

# ---------------------------------------------------------------- CLI profiles
# A role maps to a slot; `--clis a,b[,c]` fills the slots in order (default: default_clis).

[profiles.solo]
description = "One CLI plays every role. Review and verification lose independence: run them in a fresh session, ideally with a different model."
default_clis = ["claude"]
roles = { analyst = 1, architect = 1, implementer = 1, tester = 1, reviewer = 1, security = 1, documenter = 1 }

[profiles.pair]
description = "The most common real-world setup: the first CLI specifies, builds and documents; the second tests and reviews read-only."
default_clis = ["claude", "codex"]
roles = { analyst = 1, architect = 1, implementer = 1, tester = 2, reviewer = 2, security = 1, documenter = 1 }

[profiles.trio]
description = "Builder, reviewer and an independent verifier on three different CLIs."
default_clis = ["claude", "codex", "antigravity"]
roles = { analyst = 1, architect = 1, implementer = 1, tester = 3, reviewer = 2, security = 1, documenter = 1 }

