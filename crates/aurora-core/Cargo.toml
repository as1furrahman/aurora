[package]
name = "aurora-core"
description = "Aurora domain logic: workflow model, parser, planner and stage engine. No terminal or filesystem side effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "0.11"

[lints]
workspace = true
