[package]
name = "aurora-skills"
description = "Aurora skill core: SKILL.md parsing, portability, fetching, scanning and install planning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aurora-fs.workspace = true
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

[lints]
workspace = true
