[workspace]
resolver = "3"
members = ["crates/aurora-core", "crates/aurora-fs", "crates/aurora-skills", "crates/aurora-app", "crates/aurora-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/as1furrahman/aurora"
description = "Aurora: role-based agent skill manager and evidence-gated workflow orchestrator for coding CLIs"

[workspace.dependencies]
aurora-core = { path = "crates/aurora-core", version = "0.2.0" }
aurora-fs = { path = "crates/aurora-fs", version = "0.2.0" }
aurora-skills = { path = "crates/aurora-skills", version = "0.2.0" }
aurora-app = { path = "crates/aurora-app", version = "0.2.0" }
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
